name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Mondays at 05:17 UTC, to pick up new Zenodo records.
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history: aisignoff declares each line by the commit that landed it
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Read the Node version
        id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Check that the site is ready to go live
        run: node scripts/check-launch.mjs
      - name: Update Zenodo records
        run: node scripts/sync-zenodo.mjs
      - name: Update the AI declaration badges
        run: node scripts/sync-signoff-badges.mjs
      # The folder report of this repository's AI declarations, published at /signoff/ and linked from
      # /explore/ai-declarations/. Keep the version in step with the organisation's File-signoff workflow.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the AI declaration report
        run: |
          pip install "aisignoff==1.0.0rc2"
          mkdir -p public/signoff
          aisignoff report --html public/signoff/index.html --with-source --title "Industrial Mathematics Group website"
      # The site is served at the root of the custom domain, or under /<repository>/ on
      # github.io while none is set. The build reads the address from PAGES_URL.
      - name: Read the GitHub Pages address
        id: pages
        uses: actions/configure-pages@v6
      - name: Build for that address
        run: echo "PAGES_URL=${{ steps.pages.outputs.base_url }}" >> "$GITHUB_ENV"
      - uses: withastro/action@v6
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Check the internal links of the deployed build
        run: node scripts/check-links.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
